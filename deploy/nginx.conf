# nginx per Instant Translator — consegna a ~2500 ascoltatori in piazza.
#
# Principio: il processo Python fa ASR/traduzione/TTS in tempo reale. Se gli
# fai anche servire 2500 telefoni (pagina, JS, playlist, segmenti) il GIL e il
# disco vanno a competere con la pipeline e la voce tradotta comincia a
# singhiozzare. Quindi:
#
#   * i file HLS e il frontend li serve nginx **da disco** (zero origine);
#   * solo /api/* e i WebSocket vanno all'origine, con cache dove possibile;
#   * la regia (/admin, /api/admin) è raggiungibile solo dalla rete di regia.
#
# Banda: 64 kbps/ascoltatore => ~160 Mbps per 2500. Verifica l'uplink; se il
# pubblico è su LTE/5G o su una WiFi pubblica, metti una CDN davanti a nginx.
#
# ⚠️  nginx su Windows usa select() e regge ~1024 connessioni per worker: per
#    2500 client mettilo su Linux (anche una VM/mini-PC), pure se l'origine
#    con la GPU resta su Windows. In quel caso usa il blocco "origine remota"
#    più sotto invece di servire da disco.
#
# Avvio origine:  uvicorn app.main:app --host 127.0.0.1 --port 8000

user  www-data;
worker_processes auto;
worker_rlimit_nofile 32768;
events {
    worker_connections 8192;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t                    ts;
    }

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    # I telefoni fanno tante richieste piccole e ravvicinate: il keepalive
    # evita un handshake TLS per ogni segmento.
    keepalive_timeout  75s;
    keepalive_requests 1000;
    access_log off;                 # 2500 client × 1 req/s = log inutile e I/O

    # Cache per quando l'origine è su un'altra macchina (vedi in fondo).
    proxy_cache_path /var/cache/nginx/hls levels=1:2 keys_zone=hls:50m
                     max_size=2g inactive=60s use_temp_path=off;

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    upstream origin {
        server 127.0.0.1:8000;
        keepalive 64;
    }

    # Un telefono onesto apre poche connessioni: il limite protegge da un
    # client impazzito, non dal pubblico.
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    server {
        listen 80;
        # listen 443 ssl http2;    # in produzione: HTTPS (e HTTP/2 aiuta molto)
        # ssl_certificate     /etc/ssl/certs/evento.crt;
        # ssl_certificate_key /etc/ssl/private/evento.key;
        # ssl_session_cache   shared:SSL:10m;
        # ssl_session_timeout 1h;

        limit_conn perip 20;

        # ---------------------------------------------------------------- #
        # 1) HLS servito DIRETTAMENTE da disco (origine sulla stessa macchina)
        #    Sostituisci il path con la tua hls.output_dir assoluta.
        # ---------------------------------------------------------------- #
        location /hls/ {
            alias /srv/instanttranslator/data/hls/;
            add_header Access-Control-Allow-Origin *;

            location ~ \.m3u8$ {
                alias /srv/instanttranslator/data/hls/;
                add_header Cache-Control "no-cache, max-age=1";
                add_header Access-Control-Allow-Origin *;
            }
            location ~ \.ts$ {
                alias /srv/instanttranslator/data/hls/;
                # I nomi dei segmenti non vengono mai riusati: cache lunga sicura.
                add_header Cache-Control "public, max-age=31536000, immutable";
                add_header Access-Control-Allow-Origin *;
            }
        }

        # ---------------------------------------------------------------- #
        # 2) Frontend statico da disco
        # ---------------------------------------------------------------- #
        location /static/ {
            alias /srv/instanttranslator/app/web/static/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            gzip on;
            gzip_types text/css application/javascript;
        }

        location = / {
            alias /srv/instanttranslator/app/web/index.html;
            add_header Cache-Control "public, max-age=30";
        }

        # ---------------------------------------------------------------- #
        # 3) API dell'ascoltatore: piccole e cacheabili
        # ---------------------------------------------------------------- #
        # subs.json: 2500 telefoni ogni 3 s = ~830 req/s su nginx, 1 req/s
        # sull'origine grazie a cache + proxy_cache_lock.
        location ~ /subs\.json$ {
            proxy_pass http://origin;
            proxy_cache hls;
            proxy_cache_valid 200 1s;
            proxy_cache_lock on;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache $upstream_cache_status;
            gzip on; gzip_types application/json;
        }

        location = /api/info {
            proxy_pass http://origin;
            proxy_cache hls;
            proxy_cache_valid 200 5s;
            proxy_cache_lock on;
            proxy_cache_use_stale updating error timeout;
            add_header X-Cache $upstream_cache_status;
            gzip on; gzip_types application/json;
        }

        # ---------------------------------------------------------------- #
        # 4) WebSocket (regia, monitor, bassa latenza): non cacheabili
        # ---------------------------------------------------------------- #
        location /api/listen {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # ---------------------------------------------------------------- #
        # 5) REGIA: solo dalla rete di regia. In piazza il link gira: senza
        #    questo blocco chiunque può fermare i canali (il token resta la
        #    difesa applicativa, questa è quella di rete).
        # ---------------------------------------------------------------- #
        location /admin {
            allow 127.0.0.1;
            allow 192.168.10.0/24;      # <-- la TUA subnet di regia
            deny all;
            proxy_pass http://origin;
        }
        location /api/admin {
            allow 127.0.0.1;
            allow 192.168.10.0/24;      # <-- la TUA subnet di regia
            deny all;
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location = /healthz {
            proxy_pass http://origin;
            access_log off;
        }

        # Resto (fallback verso l'origine).
        location / {
            proxy_pass http://origin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ------------------------------------------------------------------ #
    # VARIANTE "origine remota": nginx su Linux, origine (GPU) su Windows.
    # Sostituisci i blocchi 1) e 2) con questi e punta l'upstream al PC GPU.
    # ------------------------------------------------------------------ #
    #   location ~ \.ts$ {
    #       proxy_pass http://origin;
    #       proxy_cache hls;
    #       proxy_cache_valid 200 1y;
    #       proxy_cache_lock on;            # un solo MISS verso l'origine
    #       proxy_cache_use_stale updating error timeout;
    #       add_header Cache-Control "public, max-age=31536000, immutable";
    #   }
    #   location ~ \.m3u8$ {
    #       proxy_pass http://origin;
    #       proxy_cache hls;
    #       proxy_cache_valid 200 1s;
    #       proxy_cache_lock on;
    #   }
    #   location /static/ { proxy_pass http://origin; expires 1h; }
}
